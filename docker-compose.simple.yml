version: '3.8'

services:
  mcp:
    build: .
    environment:
      SSE_PORT: 3001
      API_BASE_URL: http://host.docker.internal:3000
# AUTH_TOKEN comes from client via mcp-proxy headers
      PYTHONUNBUFFERED: 1
    ports:
      - "3001:3001"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
