services:
  icards-mcp:
    build: .
    container_name: icards-mcp-server
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://host.docker.internal:3000}
      - API_TIMEOUT=${API_TIMEOUT:-30}
      - SSE_PORT=3001
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
