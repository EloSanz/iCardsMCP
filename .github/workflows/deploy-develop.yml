name: Deploy to Develop

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hostinger

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate secrets
      run: |
        if [ -z "${{ secrets.SSH_HOST }}" ]; then
          echo "❌ SSH_HOST secret is not set"
          echo "Please add SSH_HOST secret in GitHub repository settings"
          exit 1
        fi
        if [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
          echo "❌ SSH_PASSWORD secret is not set"
          echo "Please add SSH_PASSWORD secret in GitHub repository settings"
          exit 1
        fi
        echo "✅ SSH secrets are configured"

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        timeout: 30s  # Connection timeout
        script: |
          echo "Checking directory..."
          ls -la /root/
          echo "Changing to project directory..."
          cd /root/iCardsMCP || (echo "Directory not found, creating..." && exit 1)
          echo "Current directory: $(pwd)"
          echo "Doing git pull..."
          git pull origin develop
          echo "Setting PATH..."
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          echo "Running uv sync..."
          uv sync
          echo "uv sync completed successfully"
          echo "Killing old processes..."
          # More specific process killing to avoid interfering with SSH session
          ps aux | grep "python server.py" | grep -v grep | awk '{print $2}' | xargs kill -9 2>/dev/null || echo "No python server processes to kill"
          ps aux | grep "uv run python server.py" | grep -v grep | awk '{print $2}' | xargs kill -9 2>/dev/null || echo "No uv server processes to kill"
          echo "Starting server..."
          uv run python server.py > /dev/null 2>&1 &
          echo "Server started in background - deployment complete!"
