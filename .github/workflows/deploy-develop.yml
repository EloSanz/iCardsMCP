name: Deploy to Develop (PR)

on:
  pull_request:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hostinger

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate secrets
      run: |
        if [ -z "${{ secrets.SSH_HOST }}" ]; then
          echo "❌ SSH_HOST secret is not set"
          echo "Please add SSH_HOST secret in GitHub repository settings"
          exit 1
        fi
        if [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
          echo "❌ SSH_PASSWORD secret is not set"
          echo "Please add SSH_PASSWORD secret in GitHub repository settings"
          exit 1
        fi
        echo "✅ SSH secrets are configured"

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        timeout: 30s  # Connection timeout
        script: |
          cd /root/iCardsMCP
          git pull origin develop
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv sync
          pkill -f "python server.py" || echo "No python server process found"
          pkill -f "uv run python server.py" || echo "No uv server process found"
          sleep 2
          echo "🚀 Starting server..."
          timeout 10 uv run python server.py &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 5
          if ps -p $SERVER_PID > /dev/null 2>&1; then
            echo "✅ Server is running (PID: $SERVER_PID)"
            pkill -f "uv run python server.py" || true
            echo "🛑 Killed test server, starting production server..."
            uv run python server.py > server.log 2>&1 &
            sleep 2
            echo "🎉 Deployment completed!"
          else
            echo "❌ Server failed to start within 5 seconds"
            exit 1
          fi
