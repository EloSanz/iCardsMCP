name: Deploy to Develop (PR)

on:
  pull_request:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hostinger

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate secrets
      run: |
        if [ -z "${{ secrets.SSH_HOST }}" ]; then
          echo "❌ SSH_HOST secret is not set"
          echo "Please add SSH_HOST secret in GitHub repository settings"
          exit 1
        fi
        if [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
          echo "❌ SSH_PASSWORD secret is not set"
          echo "Please add SSH_PASSWORD secret in GitHub repository settings"
          exit 1
        fi
        echo "✅ SSH secrets are configured"

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        timeout: 30s  # Connection timeout
        script: |
          cd /root/iCardsMCP
          git pull origin develop
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv sync
          pkill -f "python server.py" || true
          pkill -f "uv run python server.py" || true
          sleep 1
          echo "Starting server..."
          uv run python server.py > /dev/null 2>&1 &
          echo "Server started in background"
